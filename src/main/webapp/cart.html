<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoodHub | Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

/* Navbar */

.navbar{

    width:100%;
    height:70px;
    background:#ff6b35;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 60px;
}

.logo{

    font-size:30px;
    font-weight:bold;
    color:white;

}

.nav-links{

    display:flex;
    gap:30px;

}

.nav-links a{

    text-decoration:none;
    color:white;
    font-size:18px;
    transition:.3s;

}

.nav-links a:hover{

    color:black;

}

/* Main Container */

.container{

    width:90%;
    margin:40px auto;

}

.heading{

    text-align:center;
    color:#333;
    margin-bottom:35px;

}

/* Cart */

.cart-container{

    width:100%;
    background:white;

    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);

    overflow:hidden;

}

/* Header */

.cart-header{

    background:#ff6b35;
    color:white;

    display:flex;
    align-items:center;

    padding:18px 25px;

    font-weight:bold;
    font-size:18px;

}

.cart-header .item-name{

    flex:3;

}

.cart-header .item-price{

    flex:1;
    text-align:center;

}

.cart-header .item-quantity{

    flex:1;
    text-align:center;

}

.cart-header .item-total{

    flex:1;
    text-align:center;

}

.cart-header .item-action{

    flex:1;
    text-align:center;

}

/* Cart Item */

.cart-item{

    display:flex;
    align-items:center;

    padding:20px 25px;

    border-bottom:1px solid #ddd;

    transition:.3s;

}

.cart-item:hover{

    background:#fafafa;

}

/* Item Name */

.item-name{

    flex:3;

    font-size:17px;
    font-weight:bold;
    color:#333;

}

/* Price */

.item-price{

    flex:1;

    text-align:center;

    color:#555;
    font-size:17px;

}

/* Quantity */

.item-quantity{

    flex:1;

    display:flex;
    justify-content:center;

}

.quantity{

    display:flex;
    align-items:center;
    gap:10px;

}

.quantity button{

    width:30px;
    height:30px;

    border:none;
    border-radius:4px;

    background:#ff6b35;
    color:white;

    font-size:18px;

    cursor:pointer;

}

.quantity button:hover{

    background:#e85a2b;

}

.quantity span{

    font-size:18px;
    font-weight:bold;

}

/* Total */

.item-total{

    flex:1;

    text-align:center;

    font-size:17px;
    font-weight:bold;

    color:#28a745;

}

/* Action */

.item-action{

    flex:1;

    display:flex;
    justify-content:center;

}

.remove-btn{

    padding:8px 18px;

    border:none;
    border-radius:5px;

    background:red;
    color:white;

    cursor:pointer;

}

.remove-btn:hover{

    background:darkred;

}

/* Grand Total */

.grand-total{

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:25px;

    background:#fff8f3;

    font-size:24px;
    font-weight:bold;

}

.total-price{

    color:#ff6b35;

}

/* Buttons */

.cart-buttons{

    display:flex;
    justify-content:space-between;

    margin-top:30px;

}

.add-items button{

    padding:15px 30px;

    border:none;
    border-radius:6px;

    background:#007bff;
    color:white;

    font-size:17px;

    cursor:pointer;

}

.add-items button:hover{

    background:#0056b3;

}

.checkout button{

    padding:15px 35px;

    border:none;
    border-radius:6px;

    background:#28a745;
    color:white;

    font-size:17px;

    cursor:pointer;

}

.checkout button:hover{

    background:#218838;

}

/* Responsive */

@media(max-width:900px){

.navbar{

    padding:0 20px;

}

.cart-header,
.cart-item{

    min-width:850px;

}

.cart-container{

    overflow-x:auto;

}

.cart-buttons{

    flex-direction:column;
    gap:20px;

}

.add-items button,
.checkout button{

    width:100%;

}

}

</style>

</head>

<body>

<!-- Navbar -->

<div class="navbar">

    <div class="logo">
        FoodHub
    </div>

    <div class="nav-links">

        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Cart</a>
        <a href="#">Logout</a>

    </div>

</div>

<div class="container">

<h1 class="heading">
My Cart
</h1>

<div class="cart-container">

<div class="cart-header">

<div class="item-name">
Item Name
</div>

<div class="item-price">
Price
</div>

<div class="item-quantity">
Quantity
</div>

<div class="item-total">
Total
</div>

<div class="item-action">
Action
</div>

</div>

<!-- Cart Item 1 -->

<div class="cart-item">

    <div class="item-name">
        Chicken Biryani
    </div>

    <div class="item-price">
        ₹250
    </div>

    <div class="item-quantity">

        <div class="quantity">
            <button>-</button>
            <span>1</span>
            <button>+</button>
        </div>

    </div>

    <div class="item-total">
        ₹250
    </div>

    <div class="item-action">
        <button class="remove-btn">Remove</button>
    </div>

</div>

<!-- Cart Item 2 -->

<div class="cart-item">

    <div class="item-name">
        Paneer Pizza
    </div>

    <div class="item-price">
        ₹350
    </div>

    <div class="item-quantity">

        <div class="quantity">
            <button>-</button>
            <span>2</span>
            <button>+</button>
        </div>

    </div>

    <div class="item-total">
        ₹700
    </div>

    <div class="item-action">
        <button class="remove-btn">Remove</button>
    </div>

</div>

<!-- Cart Item 3 -->

<div class="cart-item">

    <div class="item-name">
        French Fries
    </div>

    <div class="item-price">
        ₹120
    </div>

    <div class="item-quantity">

        <div class="quantity">
            <button>-</button>
            <span>1</span>
            <button>+</button>
        </div>

    </div>

    <div class="item-total">
        ₹120
    </div>

    <div class="item-action">
        <button class="remove-btn">Remove</button>
    </div>

</div>

<!-- Grand Total -->

<div class="grand-total">

    <div class="total-label">
        Grand Total
    </div>

    <div class="total-price">
        ₹1070
    </div>

</div>

</div>

<!-- Buttons -->

<div class="cart-buttons">

    <div class="add-items">

        <button>
            + Add More Items
        </button>

    </div>

    <div class="checkout">

        <button>
            Proceed to Checkout
        </button>

    </div>

</div>

</div>

</body>
</html>
